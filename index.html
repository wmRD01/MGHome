<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f5ee">
  <meta name="description" content="你的 Cocos 遊戲大廳。點選遊戲頁簽，直達下一場冒險。">
  <title>Cocos Play｜遊戲大廳</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23283c2e'/%3E%3Cpath d='M26 18 45 32 26 46Z' fill='%23dbf396'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./game-art.js" defer></script>
  <script src="./launcher.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#game-library">跳至遊戲入口</a>
  <header class="site-header" id="site-header">
    <div class="header-main content-width">
      <a class="brand" href="./" aria-label="Cocos Play 遊戲大廳">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m12 8 12 8-12 8Z" fill="currentColor"/></svg></span>
        <span>cocos<span class="brand-light">play</span><span class="brand-period">.</span></span>
      </a>
      <div class="header-right"><span class="header-label">我的遊戲庫</span><span class="service-status" id="service-status" role="status"><i aria-hidden="true"></i><span id="service-label">正在載入</span></span></div>
    </div>
    <nav class="game-nav content-width" aria-label="遊戲入口頁簽">
      <button class="nav-arrow" id="tabs-prev" type="button" aria-label="向左捲動遊戲頁簽" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button>
      <div class="game-tabs" id="game-tabs" aria-label="拖曳或點選遊戲頁簽"><span class="tabs-placeholder">正在載入遊戲頁簽…</span></div>
      <button class="nav-arrow" id="tabs-next" type="button" aria-label="向右捲動遊戲頁簽" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button>
    </nav>
  </header>
  <div class="page-shell content-width">
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><div class="eyebrow"><span></span> YOUR NEXT ADVENTURE</div><h1 id="page-title">挑一款，開始冒險<span>。</span></h1><p>點選上方頁簽，直達想玩的入口。</p></div>
        <div class="library-count"><span id="game-count">—</span><div>款遊戲<br><strong>等你探索</strong></div></div>
      </section>
      <div class="notice" id="notice" role="status" hidden><span id="notice-message"></span><button id="retry-button" type="button">重新載入 <span aria-hidden="true">↻</span></button></div>
      <div class="section-label"><h2 id="library-title">遊戲大廳</h2><span>全部遊戲 <span class="label-number" id="library-count">—</span><span class="section-divider">/</span>拖曳頁簽，探索更多</span></div>
      <div id="game-library" class="game-library" aria-labelledby="library-title" aria-busy="true" tabindex="-1"><div class="library-loading" id="library-loading" role="status"><span class="loading-dot"></span>正在整理你的遊戲庫…</div></div>
      <noscript><p class="notice">請啟用瀏覽器的 JavaScript，載入遊戲入口。</p></noscript>
      <div class="below-library"><span>選好遊戲，就讓冒險開始。</span><a href="#page-title" id="back-to-top">回到最上方 <span aria-hidden="true">↑</span></a></div>
    </main>
    <footer><span>COCOS PLAY <span class="footer-divider">/</span> 你的遊戲大廳</span><span>MADE FOR PLAY.</span></footer>
  </div>
  <template id="game-card-template">
    <article class="game-card" tabindex="-1">
      <div class="game-content">
        <div class="game-kicker"><span class="game-id"></span><span class="game-eyebrow"></span></div>
        <h2 class="game-title"></h2>
        <p class="english-title"></p>
        <p class="game-description"></p>
        <div class="game-actions"><a class="launch-button is-disabled" target="_blank" rel="noopener" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z" fill="currentColor"/></svg><span class="launch-label">確認遊戲中</span><span class="button-arrow" aria-hidden="true">↗</span></a><span class="launch-note">在新分頁開啟<br>隨時回來選遊戲</span></div>
        <div class="game-tags"><span class="genre-tag"></span><span class="availability-tag">確認中</span></div>
      </div>
      <div class="game-art" aria-hidden="true"></div>
    </article>
  </template>
